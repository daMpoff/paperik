[workspace]
members = ["crates/paperik-app", "crates/paperik-document"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/daMpoff/paperik"

[workspace.dependencies]
paperik-document = { path = "crates/paperik-document" }
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
roxmltree = "=0.21.2"
unicode-segmentation = "=1.13.3"
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
